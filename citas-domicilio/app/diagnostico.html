<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Diagnóstico — Médico</title>
  <link rel="stylesheet" href="/app/assets/css/styles.css"/>
  <style>
    fieldset{border:1px solid #223257;border-radius:10px;padding:12px;margin-bottom:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{min-width:220px;flex:1}
    textarea{width:100%; min-height:90px}
    .panel{background:#0b1533;border:1px solid #223257;border-radius:8px;padding:10px;color:#e8eefc}
    .k{color:#8ab4ff}
  </style>
</head>
<body class="app">
<div class="container">
  <h1>Diagnóstico — Médico</h1>
  <p><a class="pill" href="/app/index.html">← Menú</a></p>
  <div id="msg" class="alert"></div>

  <fieldset>
    <legend>Consultar</legend>
    <div class="row">
      <label>ID Cita <input id="cita" inputmode="numeric" placeholder="ID"/></label>
      <button id="btnVer" class="secondary" type="button">Ver diagnóstico</button>
    </div>
    <div id="view" class="panel" style="display:none;"></div>
  </fieldset>

  <fieldset>
    <legend>Registrar / Actualizar</legend>
    <div class="row">
      <label>Diagnóstico
        <textarea id="diag" placeholder="Resumen diagnóstico"></textarea>
      </label>
    </div>
    <div class="row">
      <label>Medicación Administrada
        <textarea id="medadm" placeholder="Detalle medicación"></textarea>
      </label>
      <label>Receta
        <textarea id="receta" placeholder="Receta"></textarea>
      </label>
    </div>
    <div class="row">
      <label>Tratamiento
        <textarea id="trat" placeholder="Tratamiento"></textarea>
      </label>
      <label>Observaciones
        <textarea id="obs" placeholder="Observaciones"></textarea>
      </label>
    </div>
    <div class="row">
      <button id="btnGuardar" type="button">Guardar</button>
    </div>
  </fieldset>
</div>

<script>
async function api(u,o={}){ const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}); const ct=r.headers.get('Content-Type')||''; const b=ct.includes('json')?await r.json():await r.text(); if(!r.ok) throw Object.assign(new Error('HTTP '+r.status),{status:r.status,body:b}); return b;}
function setMsg(t,err){ const el=document.getElementById('msg'); el.textContent=t||''; el.style.display=t?'block':'none'; el.classList.toggle('error',!!err); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

document.getElementById('btnVer').onclick = async ()=>{
  try{
    const id = Number((document.getElementById('cita').value||'').trim()); if(!id) return setMsg('Ingresa ID de cita',true);
    const r = await api('/api/diagnostico?cita_id='+id);
    const d = r?.data;
    const box = document.getElementById('view');
    if (!d) { box.style.display='block'; box.innerHTML='<i>(Sin diagnóstico para esta cita)</i>'; return setMsg(''); }
    box.style.display='block';
    box.innerHTML = `
      <div><span class="k">Cita:</span> ${escapeHtml(d.Cita_id)}</div>
      <div><span class="k">Diagnóstico:</span> ${escapeHtml(d.Diagnostico)}</div>
      <div><span class="k">Medicación Administrada:</span> ${escapeHtml(d.Medicacion_Administrada)}</div>
      <div><span class="k">Receta:</span> ${escapeHtml(d.Receta)}</div>
      <div><span class="k">Tratamiento:</span> ${escapeHtml(d.Tratamiento)}</div>
      <div><span class="k">Observaciones:</span> ${escapeHtml(d.Observaciones)}</div>`;
    setMsg('');
  }catch(e){ setMsg(e?.body?.error||'Error al consultar diagnóstico',true); }
};

document.getElementById('btnGuardar').onclick = async ()=>{
  try{
    const id = Number((document.getElementById('cita').value||'').trim()); if(!id) return setMsg('Ingresa ID de cita',true);
    const body={ cita_id:id, diagnostico:document.getElementById('diag').value, medicacion_administrada:document.getElementById('medadm').value, receta:document.getElementById('receta').value, tratamiento:document.getElementById('trat').value, observaciones:document.getElementById('obs').value };
    await api('/api/diagnostico',{method:'POST',body:JSON.stringify(body)});
    setMsg('Diagnóstico guardado');
  }catch(e){ setMsg(e?.body?.error||'Error al guardar diagnóstico',true); }
};
</script>
</body>
</html>
