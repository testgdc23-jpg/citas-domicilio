<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pacientes</title>
  <style>
    body { font-family: system-ui, Arial; margin: 24px; }
    h1 { margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    label { display: block; font-size: 12px; color: #444; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px 14px; border: 0; border-radius: 10px; cursor: pointer; }
    button.primary { background: #111; color: #fff; }
    button.secondary { background: #eee; }
    .row { display: flex; gap: 10px; align-items: center; }
    .card { border: 1px solid #e6e6e6; border-radius: 14px; padding: 16px; margin: 14px 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    th { font-size: 12px; color: #555; }
    .muted { color: #666; font-size: 12px; }
    .error { color: #b00020; }
    .ok { color: #0a7a2f; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <h1>Pacientes</h1>
  <div class="muted">API: <code>/api/paciente</code></div>

  <div class="card">
    <h2 style="margin:0 0 12px;">Nuevo paciente</h2>

    <form id="frm" autocomplete="off">
      <div class="grid">

          <label for="ci">CI (10 dígitos)</label>
          <input id="ci" name="ci" inputmode="numeric" maxlength="10" placeholder="0912345678" required />
        </div>
        <div>
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" placeholder="Juan" required />
        </div>
        <div>
          <label for="apellido">Apellido</label>
          <input id="apellido" name="apellido" placeholder="Perez" required />
        </div>
        <div>
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" inputmode="tel" placeholder="0999999999" />
        </div>
      </div>
