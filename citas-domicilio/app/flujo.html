<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Flujo — Call Center (botón por tabla)</title>
  <link rel="stylesheet" href="/app/assets/css/styles.css"/>
  <style>
    fieldset{border:1px solid #223257;border-radius:10px;padding:12px;margin-bottom:14px}
    legend{padding:0 8px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row>*{min-width:220px;flex:1}
    .muted{opacity:.85}
    .hide{display:none}
    textarea{width:100%}
  </style>
</head>
<body class="app">
<div class="container">
  <h1>Flujo — Call Center</h1>
  <p><a class="pill" href="/app/index.html">← Menú</a></p>
  <div id="msg" class="alert" style="display:none"></div>

  <!-- Buscar por CI -->
  <fieldset>
    <legend>Buscar Paciente por CI</legend>
    <div class="row">
      <label>CI <input id="ci" placeholder="10 dígitos"/></label>
      <button id="btnBuscar" class="secondary" type="button">Buscar</button>
      <button id="btnLimpiar" type="button">Limpiar</button>
    </div>
    <p class="muted">Si el paciente existe, se cargan los datos y su <b>última dirección</b>; puedes editarlos.</p>
  </fieldset>

  <!-- PACIENTE -->
  <fieldset>
    <legend>Paciente</legend>
    <div class="row">
      <label>Nombres <input id="p-nombre"/></label>
      <label>Apellidos <input id="p-apellido"/></label>
      <label>Teléfono <input id="p-telefono" placeholder="+593..."/></label>
      <label>Escuela (opcional)
        <select id="p-escuela"><option value="">— Ninguna —</option></select>
      </label>
    </div>
    <div class="row">
      <button id="btnGuardarPaciente" type="button">Guardar/Actualizar Paciente</button>
    </div>
  </fieldset>

  <!-- DIRECCIÓN -->
  <fieldset>
    <legend>Dirección (última, editable)</legend>
    <div class="row">
      <label>Ciudad <input id="d-ciudad"/></label>
      <label>Dirección <input id="d-direccion" placeholder="Calle, #, etc."/></label>
      <label>Zona
        <select id="d-zona">
          <option value="">(no especifica)</option>
          <option value="Urbano">Urbano</option>
          <option value="Rural">Rural</option>
          <option value="Exurbano">Exurbano</option>
        </select>
      </label>
      <label>Referencia <input id="d-referencia"/></label>
      <label>Sector <input id="d-sector"/></label>
    </div>
    <div class="row">
      <button id="btnGuardarDireccion" type="button">Guardar/Actualizar Dirección</button>
    </div>
  </fieldset>

  <!-- CITA -->
  <fieldset>
    <legend>Cita</legend>
    <div class="row">
      <label>Seguro
        <select id="c-seguro"><option value="">— Selecciona —</option></select>
      </label>
      <label>Fecha <input id="c-fecha" type="date"/></label>
      <label>Hora <input id="c-hora" type="time"/></label>
    </div>
    <div class="row">
      <label style="flex:2;">Síntomas
        <textarea id="c-sintomas" rows="3" placeholder="Descripción de síntomas"></textarea>
      </label>
    </div>
    <div id="mawdyBox" class="row hide">
      <label>Asistencia (9 díg) <input id="c-asistencia" inputmode="numeric" maxlength="9"/></label>
      <label>Movimiento (6 díg) <input id="c-movimiento" inputmode="numeric" maxlength="6"/></label>
    </div>
    <div class="row">
      <button id="btnGuardarCita" type="button">Guardar Cita</button>
      <button id="btnImprimir" class="secondary" type="button" disabled>Ver/Imprimir Orden</button>
    </div>
    <input type="hidden" id="pacienteId" value=""/>
    <input type="hidden" id="citaId" value=""/>
  </fieldset>
</div>

<script>
const $ = id => document.getElementById(id);
