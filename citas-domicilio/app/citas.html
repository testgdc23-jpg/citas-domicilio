<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Citas</title>
  <link rel="stylesheet" href="/app/assets/css/styles.css"/>
</head>
<body class="app">
<div class="container">
  <h1>Citas</h1>
  <p><a class="pill" href="/">← Volver</a></p>

  <div id="msg" class="alert"></div>

  <fieldset style="margin-top:10px;border:1px solid #223257;border-radius:10px;padding:12px;">
    <legend>Agendar Cita</legend>

    <div class="form-row">
      <label>Paciente
        <select id="paciente">
          <option value="">— Selecciona un paciente —</option>
        </select>
      </label>

      <label>Seguro
        <select id="seguro">
          <option value="">— Selecciona un seguro —</option>
        </select>
      </label>

      <label>Fecha
        <input type="date" id="fecha"/>
      </label>

      <label>Hora
        <input type="time" id="hora"/>
      </label>
    </div>

    <div class="form-row">
      <label style="flex:1;">Síntomas
        <input id="sintomas" placeholder="Descripción de síntomas"/>
      </label>
    </div>

    <div id="mawdyBox" class="form-row" style="display:none;">
      <label>Asistencia
        <input id="asistencia" inputmode="numeric" maxlength="9" placeholder="9 dígitos"/>
      </label>
      <label>Movimiento
        <input id="movimiento" inputmode="numeric" maxlength="6" placeholder="6 dígitos"/>
      </label>
    </div>

    <div class="form-row">
      <button id="btnAgendar" type="button">Agendar</button>
      <button id="btnOrden" type="button" class="secondary" disabled>Generar Orden</button>
    </div>

    <input id="citaId" type="hidden" value=""/>
  </fieldset>
</div>

<script src="/app/assets/js/common.js"></script>
<script>
const msg = document.querySelector('#msg');
const paciente = document.querySelector('#paciente');
const seguro   = document.querySelector('#seguro');
const fecha    = document.querySelector('#fecha');
const hora     = document.querySelector('#hora');
const sintomas = document.querySelector('#sintomas');
const mawdyBox = document.querySelector('#mawdyBox');
const asistencia = document.querySelector('#asistencia');
const movimiento = document.querySelector('#movimiento');
const btnAgendar = document.querySelector('#btnAgendar');
const btnOrden   = document.querySelector('#btnOrden');
const citaId     = document.querySelector('#citaId');

function isMAWDY() {
  const opt = seguro.options[seguro.selectedIndex];
  return opt && opt.textContent.trim().toUpperCase() === 'MAWDY';
}

seguro.addEventListener('change', () => {
  if (isMAWDY()) mawdyBox.style.display = 'flex';
  else { mawdyBox.style.display = 'none'; asistencia.value=''; movimiento.value=''; }
});

async function cargarPacientes() {
  const payload = await api('/api/paciente');
  const list = payload?.data ?? [];
  paciente.innerHTML = '<option value="">— Selecciona un paciente —</option>' +
    list.map(p => `<option value="${p.id}">${p.apellido.toUpperCase()}, ${p.nombre} (CI:${p.ci})</option>`).join('');
}

async function cargarSeguros() {
  const payload = await api('/api/seguro');
  const list = payload?.data ?? [];
  // Puedes forzar orden específico aquí si lo prefieres
  const orden = ['KLS','MAWDY','KLS LABORATORIO','PLAN VITAL','PROASSISLIFE'];
  const sorted = [...list].sort((a,b) => orden.indexOf(a.Nombre) - orden.indexOf(b.Nombre));
  seguro.innerHTML = '<option value="">— Selecciona un seguro —</option>' +
    sorted.map(s => `<option value="${s.id}">${s.Nombre}</option>`).join('');
}

async function agendar() {
  try {
    const paciente_id = Number(paciente.value);
    const seguro_id   = Number(seguro.value);
    const f = (fecha.value || '').trim();
    const h = (hora.value || '').trim();
    const s = (sintomas.value || '').trim();

    if (!paciente_id || !seguro_id || !f) return setAlert(msg, 'Paciente, Seguro y Fecha son obligatorios', true);

    const body = { paciente_id, seguro_id, fecha: f, hora: h, sintomas: s };
    if (isMAWDY()) {
      if (asistencia.value) body.asistencia = asistencia.value.replace(/\D/g,'');
      if (movimiento.value) body.movimiento = movimiento.value.replace(/\D/g,'');
    }

    const res = await api('/api/cita', { method: 'POST', body: JSON.stringify(body) });
    citaId.value = res?.id || '';
    btnOrden.disabled = !citaId.value;
    setAlert(msg, `Cita creada #${citaId.value || ''}`);
  } catch (e) {
    console.error(e);
    setAlert(msg, e?.body?.error || 'Error al agendar', true);
  }
}

function abrirOrden() {
  if (!citaId.value) return;
  window.open(`/app/orden.html?cita_id=${encodeURIComponent(citaId.value)}`, '_blank');
}

document.addEventListener('DOMContentLoaded', async () => {
  await cargarPacientes();
  await cargarSeguros();
});
btnAgendar.addEventListener('click', agendar);
btnOrden.addEventListener('click', abrirOrden);
</script>
</body>
</html>
