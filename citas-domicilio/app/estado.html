<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Estado de citas</title>
  <style>
    :root{
      --bg:#0b1020;
      --card:#111a33;
      --muted:#9aa7c7;
      --text:#e8eeff;
      --line:rgba(255,255,255,.08);
      --btn:#1f2b55;
      --btn2:#1a2447;
      --ok:#22c55e;
      --err:#ef4444;
      --warn:#f59e0b;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(1200px 600px at 20% 0%, #182356 0%, var(--bg) 55%);
      color:var(--text);
    }
    a{color:#bcd0ff;text-decoration:none}
    a:hover{text-decoration:underline}

    .wrap{max-width:1100px;margin:28px auto;padding:0 16px}
    .topbar{
      display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
      margin-bottom:18px;
    }
    .title h1{margin:0;font-size:34px;letter-spacing:.2px}
    .title .sub{margin-top:6px;color:var(--muted);font-size:13px}
    .nav{
      display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;
    }
    .chip{
      display:inline-flex; gap:8px; align-items:center;
      background: rgba(255,255,255,.06);
      border:1px solid var(--line);
      padding:8px 10px; border-radius:999px;
      font-size:13px; color:var(--text);
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:14px;
      overflow:hidden;
    }

    .controls{
      display:flex; gap:12px; flex-wrap:wrap;
      align-items:end;
      padding:14px;
      border-bottom:1px solid var(--line);
      background: rgba(0,0,0,.10);
    }
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input[type="date"]{
      background: rgba(0,0,0,.25);
      border:1px solid var(--line);
      color:var(--text);
      padding:9px 10px;
      border-radius:10px;
      min-width:170px;
    }
    button{
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border:1px solid var(--line);
      color:var(--text);
      padding:9px 12px;
      border-radius:10px;
      cursor:pointer;
    }
    button:hover{filter:brightness(1.08)}
    button:disabled{opacity:.45;cursor:not-allowed}
    .kpi{
      margin-left:auto;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      color:var(--muted); font-size:13px;
    }
    .kpi strong{color:var(--text)}
    .msg{
      padding:10px 14px;
      font-size:13px;
      border-top:1px solid var(--line);
      background: rgba(0,0,0,.10);
      color:var(--muted);
    }
    .msg .ok{color:var(--ok);font-weight:700}
    .msg .err{color:var(--err);font-weight:700}

    table{width:100%; border-collapse:collapse}
    th, td{
      padding:12px 12px;
      border-bottom:1px solid var(--line);
      text-align:left;
      vertical-align:top;
      font-size:14px;
    }
    th{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.3px;
      text-transform:uppercase;
      background: rgba(0,0,0,.14);
    }
    tr:hover td{background: rgba(255,255,255,.03)}
    .small{font-size:12px;color:var(--muted)}
    .nowrap{white-space:nowrap}

    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      padding:5px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      font-size:12px;
      text-transform:capitalize;
    }
    .b-agendada{border-color:rgba(245,158,11,.35); background:rgba(245,158,11,.10)}
    .b-confirmada{border-color:rgba(59,130,246,.35); background:rgba(59,130,246,.10)}
    .b-atendida{border-color:rgba(34,197,94,.35); background:rgba(34,197,94,.10)}
    .b-cancelada{border-color:rgba(239,68,68,.35); background:rgba(239,68,68,.10)}
    .b-reprogramada{border-color:rgba(168,85,247,.35); background:rgba(168,85,247,.10)}

    select{
      background: rgba(0,0,0,.25);
      border:1px solid var(--line);
      color:var(--text);
      padding:8px 10px;
      border-radius:10px;
      min-width:160px;
      text-transform:capitalize;
    }

    .btnRow{
      display:flex; gap:8px; align-items:center;
    }
    .btnSave{
      padding:8px 10px;
      border-radius:10px;
      background: rgba(255,255,255,.08);
    }
    .rowMsg{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }
    .rowMsg.ok{color:var(--ok);font-weight:700}
    .rowMsg.err{color:var(--err);font-weight:700}

    @media (max-width: 860px){
      th:nth-child(3), td:nth-child(3){display:none} /* Oculta Dirección en pantallas pequeñas */
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">
        <h1>Estado de citas</h1>
        <div class="sub">API: <b>/api/cita</b> (GET) y <b>/api/cita_estado</b> (POST)</div>
      </div>
      <div class="nav">
        <a class="chip" href="/app/index.html">🏠 Inicio</a>
        <a class="chip" href="/app/pacientes.html">👤 Pacientes</a>
        <a class="chip" href="/app/admin.html">⚙️ Admin</a>
        <span class="chip">📌 Cambiar estado aquí</span>
      </div>
    </div>

    <div class="card">
      <div class="controls">
        <div>
          <label for="fecha">Fecha</label>
          <input id="fecha" type="date" />
        </div>

        <div>
          <button id="btnCargar" type="button">Cargar citas</button>
        </div>

        <div class="kpi">
          <div>Total: <strong id="kpiTotal">0</strong></div>
          <div>Agendadas: <strong id="kpiAg">0</strong></div>
          <div>Confirmadas: <strong id="kpiCo">0</strong></div>
          <div>Atendidas: <strong id="kpiAt">0</strong></div>
          <div>Canceladas: <strong id="kpiCa">0</strong></div>
        </div>
      </div>

      <div class="msg" id="msg"></div>

      <table>
        <thead>
          <tr>
            <th class="nowrap">ID</th>
            <th>Paciente</th>
            <th>Dirección</th>
            <th class="nowrap">Fecha/Hora</th>
            <th>Síntomas</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <!-- ✅ ESTE ES EL <tbody> QUE NO ENCONTRABAS -->
        <tbody id="tbody">
          <tr><td colspan="7" class="small">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  const ESTADOS = ["agendada","confirmada","atendida","cancelada","reprogramada"];

  function setMsg(text, type){
    const el = $("msg");
    if(!text){ el.innerHTML = ""; return; }
    el.innerHTML = type === "error"
      ? `<span class="err">✖</span> ${escapeHtml(text)}`
      : `<span class="ok">✔</span> ${escapeHtml(text)}`;
  }

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function badgeClass(estado){
    const e = String(estado||"").toLowerCase();
    return "badge " + (
      e==="agendada" ? "b-agendada" :
      e==="confirmada" ? "b-confirmada" :
      e==="atendida" ? "b-atendida" :
      e==="cancelada" ? "b-cancelada" :
      e==="reprogramada" ? "b-reprogramada" : ""
    );
  }

  function setKPIs(rows){
    const total = rows.length;
    const c = {agendada:0, confirmada:0, atendida:0, cancelada:0, reprogramada:0};
    for(const r of rows){
      const e = String(r.estado||"").toLowerCase();
      if(c[e] !== undefined) c[e]++;
    }
    $("kpiTotal").textContent = total;
    $("kpiAg").textContent = c.agendada;
    $("kpiCo").textContent = c.confirmada;
    $("kpiAt").textContent = c.atendida;
    $("kpiCa").textContent = c.cancelada;
  }

  async function loadCitas(){
    const fecha = $("fecha").value;
    if(!fecha){
      setMsg("Selecciona una fecha.", "error");
      return;
    }

    setMsg("", "ok");
    const tbody = $("tbody");
    tbody.innerHTML = `<tr><td colspan="7" class="small">Cargando...</td></tr>`;

    try{
      const res = await fetch(`/api/cita?fecha=${encodeURIComponent(fecha)}`);
      const data = await res.json();

      if(!Array.isArray(data) || data.length === 0){
        tbody.innerHTML = `<tr><td colspan="7" class="small">No hay citas para esa fecha.</td></tr>`;
        setKPIs([]);
        return;
      }

      setKPIs(data);
      tbody.innerHTML = "";

      for(const row of data){
        const tr = document.createElement("tr");

        const pacienteTxt = `${row.nombre ?? ""} ${row.apellido ?? ""}`.trim();
        const paciente = `${pacienteTxt} (${row.ci ?? ""})`.trim();
        const direccion = `${row.direccion ?? ""} - ${row.ciudad ?? ""} (${row.zona ?? ""})`.trim();
        const fh = `${row.fecha ?? ""} ${row.hora ?? ""}`.trim();
        const sintomas = row.sintomas ?? "";

        const estadoActual = String(row.estado || "agendada").toLowerCase();

        tr.innerHTML = `
          <td class="nowrap">${escapeHtml(row.id)}</td>
          <td>${escapeHtml(paciente)}</td>
          <td>${escapeHtml(direccion)}</td>
          <td class="nowrap">${escapeHtml(fh)}</td>
          <td>${escapeHtml(sintomas)}</td>
          <td>
            <div class="${badgeClass(estadoActual)}" id="badge-${row.id}">${escapeHtml(estadoActual)}</div>
            <div style="margin-top:8px">
              <select id="sel-${row.id}">
                ${ESTADOS.map(e => `<option value="${e}" ${e===estadoActual?"selected":""}>${e}</option>`).join("")}
              </select>
            </div>
          </td>
          <td>
            <div class="btnRow">
              <button class="btnSave" id="btn-${row.id}" type="button" disabled>Guardar</button>
            </div>
            <div class="rowMsg" id="rowmsg-${row.id}"></div>
          </td>
        `;

        tbody.appendChild(tr);

        const sel = $(`sel-${row.id}`);
        const btn = $(`btn-${row.id}`);
        const rowmsg = $(`rowmsg-${row.id}`);
        const badge = $(`badge-${row.id}`);

        // Habilitar guardar solo si hay cambio
        sel.addEventListener("change", () => {
          const nuevo = sel.value;
          btn.disabled = (nuevo === estadoActual);
          rowmsg.textContent = btn.disabled ? "" : "Listo para guardar…";
          rowmsg.className = "rowMsg";
        });

        btn.addEventListener("click", async () => {
          const nuevoEstado = sel.value;
          btn.disabled = true;
          rowmsg.textContent = "Guardando…";
          rowmsg.className = "rowMsg";

          try{
            const r = await fetch("/api/cita_estado", {
              method:"POST",
              headers:{ "Content-Type":"application/json" },
              body: JSON.stringify({ cita_id: row.id, estado: nuevoEstado })
            });

            const j = await r.json().catch(() => ({}));

            if(!r.ok){
              const msg = j.error || `Error HTTP ${r.status}`;
              rowmsg.textContent = msg;
              rowmsg.className = "rowMsg err";
              // Rehabilita para reintentar
              btn.disabled = false;
              return;
            }

            // Actualiza badge visual sin recargar
            badge.textContent = nuevoEstado;
            badge.className = badgeClass(nuevoEstado);

            rowmsg.textContent = "Estado actualizado.";
            rowmsg.className = "rowMsg ok";

            // Actualiza el estado “base” para el toggle
            // (si vuelve a elegir el mismo, se desactiva)
            // Nota: para simplificar, recargamos KPIs con una recarga suave:
            setTimeout(() => loadCitas(), 250);

          }catch(err){
            rowmsg.textContent = String(err.message || err);
            rowmsg.className = "rowMsg err";
            btn.disabled = false;
          }
        });
      }

    }catch(err){
      tbody.innerHTML = `<tr><td colspan="7" class="small">Error cargando citas.</td></tr>`;
      setMsg(String(err.message || err), "error");
      setKPIs([]);
    }
  }

  // Inicializa fecha hoy
  (function init(){
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    $("fecha").value = `${yyyy}-${mm}-${dd}`;
    $("btnCargar").addEventListener("click", loadCitas);
    loadCitas();
  })();
</script>
</body>
</html>
