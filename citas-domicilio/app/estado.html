<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Estado de citas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    h1 { margin: 0 0 10px; }
    .row { display: flex; gap: 12px; align-items: end; margin: 12px 0 18px; flex-wrap: wrap; }
    label { display: block; font-size: 12px; color: #444; margin-bottom: 6px; }
    input, select, button { padding: 8px 10px; font-size: 14px; }
    button { cursor: pointer; }
    .msg { margin: 10px 0; font-weight: 700; }
    .ok { color: #167d2b; }
    .err { color: #b00020; }

    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; vertical-align: top; }
    th { background: #fafafa; }
    .small { font-size: 12px; color: #666; }
    .btn { padding: 6px 10px; }
  </style>
</head>

<body>
  <div class="small">API: <b>/api/cita</b> y <b>/api/cita_estado</b></div>
  <h1>Estado de citas</h1>

  <div class="row">
    <div>
      <label for="fecha">Fecha</label>
      <input id="fecha" type="date" />
    </div>
    <div>
      <button id="btnCargar">Cargar citas</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Paciente</th>
        <th>Dirección</th>
        <th>Fecha/Hora</th>
        <th>Síntomas</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="7" class="small">Cargando...</td></tr>
    </tbody>
  </table>

<script>
  const $ = (id) => document.getElementById(id);

  const ESTADOS = ["agendada","confirmada","atendida","cancelada","reprogramada"];

  function setMsg(text, type="ok") {
    const el = $("msg");
    el.textContent = text || "";
    el.className = "msg " + (type === "err" ? "err" : "ok");
  }

  function todayISO() {
    const d = new Date();
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    return `${d.getFullYear()}-${mm}-${dd}`;
  }

  function estadoOptions(actual) {
    return ESTADOS.map(s =>
      `<option value="${s}" ${String(actual)===s ? "selected" : ""}>${s}</option>`
    ).join("");
  }

  async function loadCitas() {
    const fecha = $("fecha").value;
    if (!fecha) {
      setMsg("Seleccione una fecha.", "err");
      return;
    }

    setMsg("Cargando...", "ok");
    const tbody = $("tbody");
    tbody.innerHTML = `<tr><td colspan="7" class="small">Cargando...</td></tr>`;

    try {
      const res = await fetch(`/api/cita?fecha=${encodeURIComponent(fecha)}`);
      const data = await res.json();

      if (!res.ok) {
        tbody.innerHTML = `<tr><td colspan="7" class="small">Error al cargar.</td></tr>`;
        setMsg(data.error || "Error al cargar citas.", "err");
        return;
      }

      if (!Array.isArray(data) || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="small">No hay citas para esta fecha.</td></tr>`;
        setMsg("Sin resultados.", "ok");
        return;
      }

      tbody.innerHTML = "";
      for (const c of data) {
        const tr = document.createElement("tr");

        const pacienteTxt = `${c.nombre || ""} ${c.apellido || ""} (${c.ci || ""})`.trim();
        const dirTxt = `${c.direccion || ""} - ${c.ciudad || ""} (${c.zona || ""})`.trim();
        const fhTxt = `${c.fecha || ""} ${c.hora || ""}`.trim();

        tr.innerHTML = `
          <td>${c.id}</td>
          <td>${escapeHtml(pacienteTxt)}</td>
          <td>${escapeHtml(dirTxt)}</td>
          <td>${escapeHtml(fhTxt)}</td>
          <td>${escapeHtml(c.sintomas || "")}</td>
          <td>
            <select class="estadoSel" data-cita-id="${c.id}">
              ${estadoOptions(c.estado)}
            </select>
          </td>
          <td>
            <button class="btn btnGuardar" data-cita-id="${c.id}">Guardar estado</button>
          </td>
        `;

        tbody.appendChild(tr);
      }

      // conectar botones
      document.querySelectorAll(".btnGuardar").forEach(btn => {
        btn.addEventListener("click", () => guardarEstado(btn));
      });

      setMsg(`Citas cargadas: ${data.length}`, "ok");
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="7" class="small">Error.</td></tr>`;
      setMsg(String(e?.message || e), "err");
    }
  }

  async function guardarEstado(btn) {
    const citaId = Number(btn.getAttribute("data-cita-id"));
    const sel = document.querySelector(`select.estadoSel[data-cita-id="${citaId}"]`);
    const estado = sel.value;

    btn.disabled = true;
    const oldText = btn.textContent;
    btn.textContent = "Guardando...";

    try {
      const res = await fetch("/api/cita_estado", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cita_id: citaId, estado })
      });

      const data = await res.json();

      if (!res.ok) {
        setMsg(data.error || "Error al actualizar estado.", "err");
        return;
      }

      setMsg(`Estado actualizado (cita #${citaId}): ${data.estado}`, "ok");
      // refrescar para ver estado real desde DB
      await loadCitas();
    } catch (e) {
      setMsg(String(e?.message || e), "err");
    } finally {
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // init
  $("fecha").value = todayISO();
  $("btnCargar").addEventListener("click", loadCitas);
  loadCitas();
</script>
</body>
</html>
