<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Estado de citas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    h1 { margin: 0 0 10px; }
    .row { display: flex; gap: 12px; align-items: end; margin: 12px 0 18px; flex-wrap: wrap; }
    label { display: block; font-size: 12px; color: #444; margin-bottom: 6px; }
    input, select, button { padding: 8px 10px; font-size: 14px; }
    button { cursor: pointer; }
    .msg { margin: 10px 0; font-weight: 700; }
    .ok { color: #167d2b; }
    .err { color: #b00020; }

    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; vertical-align: top; }
    th { background: #fafafa; }
    .small { font-size: 12px; color: #666; }
    .btn { padding: 6px 10px; }
  </style>
</head>

<body>
  <div class="small">API: <b>/api/cita</b> y <b>/api/cita_estado</b></div>
  <h1>Estado de citas</h1>

  <div class="row">
    <div>
      <label for="fecha">Fecha</label>
      <input id="fecha" type="date" />
    </div>
    <div>
      <button id="btnCargar">Cargar citas</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Paciente</th>
        <th>Dirección</th>
        <th>Fecha/Hora</th>
        <th>Síntomas</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="7" class="small">Cargando...</td></tr>
    </tbody>
  </table>

<script>
  const $ = (id) => document.getElementById(id);

  const ESTADOS = ["agendada","confirmada","atendida","cancelada","reprogramada"];

  function setMsg(text, type="ok") {
    const el = $("msg");
    el.textContent = text || "";
    el.className = "msg " + (type === "err" ? "err" : "ok");
  }

  function todayISO() {
    const d = new Date();
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    return `${d.getFullYear()}-${mm}-${dd}`;
  }

  function estadoOptions(actual) {
    return ESTADOS.map(s =>
      `<option value="${s}" ${actual===s ? "selected" : ""}>${s}</option>`
    ).join("");
  }

  async function loadCitas() {
    const fecha = $("fecha").value;
    if (!fecha) {
      setMsg("Seleccione una fecha.", "err");
      return;
    }

    setMsg("Cargando...");
    const tbody = $("tbody");
    tbody.innerHTML = `<tr><td colspan="7" class="small">Cargando...</td></tr>`;

    const res = await fetch(`/api/cita?fecha=${fecha}`);
    const data = await res.json();

    if (!res.ok) {
      setMsg(data.error || "Error", "err");
      return;
    }

    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="7" class="small">No hay citas.</td></tr>`;
      setMsg("Sin resultados");
      return;
    }

    tbody.innerHTML = "";
    for (const c of data) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${c.id}</td>
        <td>${c.nombre} ${c.apellido} (${c.ci})</td>
        <td>${c.direccion} ${c.ciudad} (${c.zona})</td>
        <td>${c.fecha} ${c.hora}</td>
        <td>${c.sintomas || ""}</td>
        <td>
          <select data-id="${c.id}">
            ${estadoOptions(c.estado)}
          </select>
        </td>
        <td>
          <button onclick="guardar(${c.id})">Guardar</button>
        </td>
      `;
      tbody.appendChild(tr);
    }

    setMsg(`Citas: ${data.length}`);
  }

  async function guardar(id) {
    const sel = document.querySelector(`select[data-id="${id}"]`);
    const estado = sel.value;

    const res = await fetch("/api/cita_estado", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ cita_id: id, estado })
    });

    const data = await res.json();

    if (!res.ok) {
      setMsg(data.error || "Error", "err");
      return;
    }

    setMsg(`Estado actualizado a ${estado}`);
    loadCitas();
  }

  $("fecha").value = todayISO();
  $("btnCargar").onclick = loadCitas;
  loadCitas();
</script>
</body>
</html>
