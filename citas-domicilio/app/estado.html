<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Estado de citas</title>
  <style>
    body{
      background-color: #070b1a;
      color: #e8eeff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .msg{
      font-weight: bold;
      margin: 10px 0;
    }
    .ok{ color: #22c55e; }
    .err{ color: #ef4444; }
    table{ width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td{ padding: 10px; border-bottom: 1px solid #444; text-align: left; }
    th{ background: #444; }
    .small{ font-size: 12px; color: #aaa; }
    select{ padding: 5px; margin: 5px 0; }
  </style>
</head>
<body>
  <h1>Estado de citas</h1>
  <label for="fecha">Fecha:</label>
  <input id="fecha" type="date" value="2026-02-03" />
  <button id="btnCargarCitas">Cargar citas</button>
  <span id="totalCitas">Citas: 0</span>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Paciente</th>
        <th>Dirección</th>
        <th>Fecha/Hora</th>
        <th>Síntomas</th>
        <th>Estado</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="tbCitas">
      <tr><td colspan="7">Cargando...</td></tr>
    </tbody>
  </table>

  <script>
    const $ = (id) => document.getElementById(id);
    let citas = [];

    // Cargar citas por fecha
    async function cargarCitas(fecha) {
      const res = await fetch(`/api/cita?fecha=${fecha}`);
      const data = await res.json();
      citas = data;

      $("#tbCitas").innerHTML = citas.map(cita => `
        <tr>
          <td>${cita.id}</td>
          <td>${cita.paciente_nombre}</td>
          <td>${cita.direccion}</td>
          <td>${cita.fecha} ${cita.hora}</td>
          <td>${cita.sintomas || "N/A"}</td>
          <td>
            <select id="estado_${cita.id}">
              <option value="agendada" ${cita.estado === 'agendada' ? 'selected' : ''}>Agendada</option>
              <option value="confirmada" ${cita.estado === 'confirmada' ? 'selected' : ''}>Confirmada</option>
              <option value="atendida" ${cita.estado === 'atendida' ? 'selected' : ''}>Atendida</option>
            </select>
          </td>
          <td><button onclick="guardarEstado(${cita.id})">Guardar</button></td>
        </tr>
      `).join("");
    }

    // Guardar estado de cita
    async function guardarEstado(citaId) {
      const estado = $(`estado_${citaId}`).value;
      const res = await fetch('/api/cita_estado', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cita_id: citaId, estado })
      });

      const data = await res.json();
      if (data.ok) {
        alert('Estado actualizado correctamente');
        cargarCitas($("#fecha").value); // recargar citas
      } else {
        alert('Error al actualizar el estado');
      }
    }

    // Al hacer click en cargar citas
    $("#btnCargarCitas").addEventListener("click", () => {
      const fecha = $("#fecha").value;
      cargarCitas(fecha);
    });

    // Iniciar con la fecha actual
    cargarCitas($("#fecha").value);
  </script>
</body>
</html>
