<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pacientes – Citas a Domicilio</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    h1, h2 { margin-top: 30px; }
    input, select, button { padding: 6px; margin: 4px; }
    button { cursor: pointer; }
    .box { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-top: 15px; }
    .ok { color: green; }
    .error { color: red; }
    .muted { color: #666; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border-bottom: 1px solid #eee; padding: 6px; text-align: left; }
  </style>
</head>
<body>

<h1>Pacientes</h1>
<p class="muted">API: /api/paciente</p>

<div class="box">
  <h2>Nuevo paciente</h2>

  <input id="ci" placeholder="CI (10 dígitos)">
  <input id="nombre" placeholder="Nombre">
  <input id="apellido" placeholder="Apellido">
  <input id="telefono" placeholder="Teléfono">

  <br><br>
  <button id="btnSavePaciente">Guardar</button>
  <button id="btnReloadPacientes">Refrescar</button>
  <span id="pacienteMsg"></span>
</div>

<div class="box">
  <h2>Listado</h2>
  <div id="pacientesList" class="muted">Cargando…</div>
</div>

<hr>

<h1>Direcciones del paciente</h1>

<div class="box">
  <h2>Buscar direcciones</h2>
  <input id="dir_paciente_id" placeholder="ID del paciente">
  <button id="btnLoadDirs">Cargar direcciones</button>

  <div id="dirsList" class="muted"></div>
</div>

<div class="box">
  <h2>Nueva dirección</h2>

  <input id="dir_direccion" placeholder="Dirección">
  <input id="dir_ciudad" placeholder="Ciudad">
  <select id="dir_zona">
    <option value="">Zona</option>
    <option value="urbano">Urbano</option>
    <option value="extraurbano">Extraurbano</option>
  </select>
  <input id="dir_sector" placeholder="Sector">
  <input id="dir_referencia" placeholder="Referencia">

  <br><br>
  <button id="btnSaveDir">Guardar dirección</button>
  <span id="dirMsg"></span>
</div>

<script>
/* ======================
   HELPERS
====================== */
const $ = (id) => document.getElementById(id);

function setMsg(el, text, cls = "") {
  el.textContent = text;
  el.className = cls;
}

/* ======================
   PACIENTES
====================== */
async function loadPacientes() {
  const box = $("pacientesList");
  box.textContent = "Cargando…";

  try {
    const res = await fetch("/api/paciente");
    const data = await res.json();

    if (!data.length) {
      box.textContent = "No hay pacientes.";
      return;
    }

    box.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>ID</th><th>CI</th><th>Nombre</th><th>Apellido</th><th>Teléfono</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(p => `
            <tr>
              <td>${p.id}</td>
              <td>${p.ci}</td>
              <td>${p.nombre}</td>
              <td>${p.apellido}</td>
              <td>${p.telefono || ""}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  } catch {
    box.textContent = "Error cargando pacientes.";
  }
}

async function savePaciente() {
  const msg = $("pacienteMsg");

  const payload = {
    ci: $("ci").value.trim(),
    nombre: $("nombre").value.trim(),
    apellido: $("apellido").value.trim(),
    telefono: $("telefono").value.trim()
  };

  if (!payload.ci || !payload.nombre || !payload.apellido) {
    setMsg(msg, "CI, nombre y apellido son obligatorios.", "error");
    return;
  }

  setMsg(msg, "Guardando…", "muted");

  try {
    const res = await fetch("/api/paciente", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const out = await res.json();
    if (!res.ok) throw new Error(out.error);

    setMsg(msg, "Paciente guardado.", "ok");
    loadPacientes();
  } catch (err) {
    setMsg(msg, err.message, "error");
  }
}

/* ======================
   DIRECCIONES
====================== */
async function loadDirecciones() {
  const pid = Number($("dir_paciente_id").value);
  const box = $("dirsList");

  if (!pid || pid <= 0) {
    box.textContent = "ID de paciente inválido.";
    return;
  }

  box.textContent = "Cargando…";

  const res = await fetch(`/api/direccion?paciente_id=${pid}`);
  const data = await res.json();

  if (!data.length) {
    box.textContent = "Este paciente no tiene direcciones.";
    return;
  }

  box.innerHTML = `
    <ul>
      ${data.map(d => `
        <li>
          <strong>${d.direccion}</strong>
          ${d.ciudad || ""} ${d.zona || ""}
        </li>
      `).join("")}
    </ul>
  `;
}

async function saveDireccion() {
  const msg = $("dirMsg");
  const pid = Number($("dir_paciente_id").value);

  if (!pid || pid <= 0) {
    setMsg(msg, "ID de paciente inválido.", "error");
    return;
  }

  const payload = {
    paciente_id: pid,
    direccion: $("dir_direccion").value.trim(),
    ciudad: $("dir_ciudad").value.trim(),
    zona: $("dir_zona").value,
    sector: $("dir_sector").value.trim(),
    referencia: $("dir_referencia").value.trim()
  };

  if (!payload.direccion) {
    setMsg(msg, "Dirección obligatoria.", "error");
    return;
  }

  setMsg(msg, "Guardando…", "muted");

  const res = await fetch("/api/direccion", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const out = await res.json();
  if (!res.ok) {
    setMsg(msg, out.error, "error");
    return;
  }

  setMsg(msg, "Dirección guardada.", "ok");
  loadDirecciones();
}

/* ======================
   EVENTOS (PASO 4)
====================== */
$("btnSavePaciente").addEventListener("click", savePaciente);
$("btnReloadPacientes").addEventListener("click", loadPacientes);
$("btnLoadDirs").addEventListener("click", loadDirecciones);
$("btnSaveDir").addEventListener("click", saveDireccion);

/* ======================
   INIT
====================== */
loadPacientes();
</script>

</body>
</html>
