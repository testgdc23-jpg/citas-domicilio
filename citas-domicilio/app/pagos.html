<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Pagos</title>
  <link rel="stylesheet" href="/app/assets/css/styles.css"/>
  <style>
    .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{min-width:220px;flex:1}
    fieldset{border:1px solid #223257;border-radius:10px;padding:12px;margin-bottom:14px}
  </style>
</head>
<body class="app">
<div class="container">
  <h1>Pagos</h1>
  <p><a class="pill" href="/app/index.html">← Menú</a></p>
  <div id="msg" class="alert"></div>

  <fieldset>
    <legend>Buscar por ID de Cita</legend>
    <div class="row">
      <label>ID Cita
        <input id="citaId" inputmode="numeric" placeholder="ID"/>
      </label>
      <button id="btnCargar" class="secondary" type="button">Cargar</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Crear / Editar pago</legend>
    <div class="row">
      <label>Copago <input id="copago" type="number" step="0.01" min="0" value="0"/></label>
      <label>Medicina <input id="medicina" type="number" step="0.01" min="0" value="0"/></label>
      <label>Total (auto) <input id="total" type="number" step="0.01" min="0" value="0" disabled/></label>
      <label>Valor transferido <input id="transferido" type="number" step="0.01" min="0" value="0"/></label>
      <label>Forma de pago
        <select id="forma">
          <option value="">(sin especificar)</option>
          <option value="efectivo">Efectivo</option>
          <option value="transferencia">Transferencia</option>
        </select>
      </label>
      <label>Fecha pago <input id="fechaPago" type="date"/></label>
      <label style="flex:1;">Observaciones <input id="obs" placeholder="Notas"/></label>
    </div>
    <div class="row">
      <button id="btnGuardar" type="button">Guardar</button>
      <button id="btnBorrar" type="button" class="secondary" style="display:none;">Borrar pago</button>
    </div>
    <input type="hidden" id="pagoId" value=""/>
  </fieldset>
</div>

<script>
async function api(u,o={}){ const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}); const ct=r.headers.get('Content-Type')||''; const b=ct.includes('json')?await r.json():await r.text(); if(!r.ok) throw Object.assign(new Error('HTTP '+r.status),{status:r.status,body:b}); return b;}
function setMsg(t,err){ const el=document.getElementById('msg'); el.textContent=t||''; el.style.display=t?'block':'none'; el.classList.toggle('error',!!err); }
const copagoEl=bI('copago'), medicinaEl=bI('medicina'), totalEl=bI('total'), transfEl=bI('transferido'), formaEl=bI('forma'), fechaEl=bI('fechaPago'), obsEl=bI('obs'), pagoIdEl=bI('pagoId');
function bI(id){ return document.getElementById(id); }
function setTotal(){ totalEl.value=(Number(copagoEl.value||0)+Number(medicinaEl.value||0)).toFixed(2); }
copagoEl.addEventListener('input',setTotal); medicinaEl.addEventListener('input',setTotal);

document.getElementById('btnCargar').onclick = async ()=>{
  try{
    const id = Number((document.getElementById('citaId').value||'').trim()); if(!id) return setMsg('Ingresa ID de cita',true);
    const r = await api('/api/pago?cita_id='+id);
    const p = (r?.data||[])[0];
    if(!p){
      pagoIdEl.value=''; copagoEl.value='0'; medicinaEl.value='0'; transfEl.value='0'; formaEl.value=''; fechaEl.value=''; obsEl.value=''; setTotal(); document.getElementById('btnBorrar').style.display='none';
      return setMsg('Sin pago. Puedes crearlo.');
    }
    pagoIdEl.value=p.id; copagoEl.value=Number(p.copago||0); medicinaEl.value=Number(p.medicina||0); transfEl.value=Number(p.valor_transferido||0);
    formaEl.value=p.forma_pago||''; fechaEl.value=(p.fecha_pago||'').substring(0,10); obsEl.value=p.observaciones||''; setTotal(); document.getElementById('btnBorrar').style.display='inline-block'; setMsg(`Pago #${p.id} cargado`);
  }catch(e){ setMsg(e?.body?.error||'Error al consultar pago',true); }
};

document.getElementById('btnGuardar').onclick = async ()=>{
  try{
    const id = Number((document.getElementById('citaId').value||'').trim()); if(!id) return setMsg('Ingresa ID de cita',true);
    const body={ cita_id:id, copago:Number(copagoEl.value||0), medicina:Number(medicinaEl.value||0), valor_transferido:Number(transfEl.value||0), forma_pago:(formaEl.value||'').trim(), fecha_pago:(fechaEl.value||'').trim()||null, observaciones:(obsEl.value||'').trim()||null };
    await api('/api/pago',{method:'POST',body:JSON.stringify(body)});
    document.getElementById('btnCargar').onclick(); setMsg('Pago guardado');
  }catch(e){ setMsg(e?.body?.error||'Error al guardar pago',true); }
};

document.getElementById('btnBorrar').onclick = async ()=>{
  try{
    const id=Number(pagoIdEl.value); if(!id) return setMsg('No hay pago para borrar',true);
    await api('/api/pago/'+id,{method:'DELETE'});
    document.getElementById('btnCargar').onclick(); setMsg('Pago eliminado');
  }catch(e){ setMsg(e?.body?.error||'Error al borrar pago',true); }
};
</script>
</body>
</html>
