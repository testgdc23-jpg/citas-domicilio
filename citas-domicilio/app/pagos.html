<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pagos</title>

  <!-- ===== CSS EMBEBIDO (no dependencias externas) ===== -->
  <style>
    :root { color-scheme: light dark; }
    body.app { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b1320; color:#e6edf3; }
    .container { max-width:1100px; margin:24px auto; padding:0 16px; }
    h1 { margin:16px 0 12px; }
    a.pill, .pill { display:inline-block; padding:8px 12px; border-radius:12px; background:#162033; color:#dbe7ff; text-decoration:none; border:1px solid #223257; }
    .pill:hover { background:#1b2947; }
    .table { width:100%; border-collapse:collapse; margin-top:12px; }
    .table th, .table td { border-bottom:1px solid #223257; padding:8px; text-align:left; }
    .actions { display:flex; gap:8px; }
    button, .btn { background:#1e3a8a; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; }
    button.secondary { background:#334155; }
    .form-row { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
    .form-row label { display:flex; flex-direction:column; gap:4px; min-width:220px; }
    input, select, textarea { padding:8px; border-radius:8px; border:1px solid #223257; background:#0f172a; color:#e6edf3; }
    .alert { padding:8px 12px; border-radius:8px; background:#0f5132; color:#55d69e; border:1px solid #145a3a; margin:8px 0; display:none; }
    .alert.error { background:#3d0c0c; color:#ffb4b4; border-color:#6d1b1b; }
    legend { padding:0 8px; color:#98b1ff; }
  </style>
</head>
<body class="app">
  <div class="container">
    <h1>Pagos</h1>
    <p><a class="pill" href="/">&larr; Volver</a></p>

    <div id="msg" class="alert"></div>

    <!-- Selección -->
    <div class="form-row">
      <label>Paciente
        <select id="selPaciente"><option value="">-- Selecciona un paciente --</option></select>
      </label>
      <label>Fecha (opcional)
        <input type="date" id="fFecha" />
      </label>
      <button id="btnBuscarCitas" class="secondary" type="button">Buscar Citas</button>
    </div>

    <div class="form-row">
      <label>Cita
        <select id="selCita" disabled><option value="">-- Selecciona primero un paciente --</option></select>
      </label>
      <button id="btnVerPago" class="secondary" type="button" disabled>Ver Pago</button>
    </div>

    <!-- Formulario Pago -->
    <fieldset style="margin-top:16px; border:1px solid #223257; border-radius:10px; padding:12px;">
      <legend>Crear / Editar pago</legend>
      <div class="form-row">
        <label>Copago
          <input id="copago" type="number" step="0.01" min="0" value="0" />
        </label>
        <label>Medicina
          <input id="medicina" type="number" step="0.01" min="0" value="0" />
        </label>
        <label>Total (auto)
          <input id="total" type="number" step="0.01" min="0" value="0" disabled />
        </label>
        <label>Valor transferido
          <input id="transferido" type="number" step="0.01" min="0" value="0" />
        </label>
        <label>Forma de pago
          <select id="forma">
            <option value="">(sin especificar)</option>
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia</option>
          </select>
        </label>
        <label>Fecha pago
          <input id="fechaPago" type="date" />
        </label>
        <label style="flex:1;">Observaciones
          <input id="obs" placeholder="Notas del pago" />
        </label>
      </div>
      <div class="form-row">
        <button id="btnGuardar" type="button">Guardar</button>
        <button id="btnBorrar" type="button" class="secondary" style="display:none;">Borrar pago</button>
      </div>
      <input type="hidden" id="pagoId" value="" />
    </fieldset>

    <!-- Tabla (histórico rápido) -->
    <h3 style="margin-top:18px;">Pagos recientes</h3>
    <table class="table" id="tblPagos">
      <thead>
        <tr>
          <th>ID</th><th>Cita</th><th>Copago</th><th>Medicina</th>
          <th>Total</th><th>Transferido</th><th>Forma</th><th>Fecha</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ===== JS EMBEBIDO (api() + lógica de Pagos) ===== -->
  <script>
    // ==== util común (api + alerta) ====
    const BASE = ''; // en producción, déjalo vacío

    async function api(path, options = {}) {
      const url = \`\${BASE}\${path}\`;
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });

      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        if (/^\\s*<!doctype|^\\s*<html/i.test(text)) {
          console.error('La URL devolvió HTML:', url, 'status:', res.status, 'sample:', text.slice(0, 200));
          throw new Error(\`La URL \${path} devolvió HTML (posible 404/500 en Functions).\`);
        }
        console.error('Respuesta no JSON:', url, 'status:', res.status, 'sample:', text.slice(0, 200));
        throw new Error(\`Respuesta no JSON desde \${path}: \${text.slice(0, 120)}...\`);
      }

      if (!res.ok || data.ok === false) {
        console.error('API error:', url, 'status:', res.status, 'payload:', data);
        throw new Error(data.error || \`Error HTTP \${res.status}\`);
      }
      return data;
    }

    function setAlert(el, msg, isErr=false) {
      el.textContent = msg;
      el.classList.toggle('error', isErr);
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 4000);
    }

    // ==== referencias UI ====
    const msg = document.querySelector('#msg');
    const selPaciente = document.querySelector('#selPaciente');
    const fFecha      = document.querySelector('#fFecha');
    const btnBuscarCitas = document.querySelector('#btnBuscarCitas');

    const selCita = document.querySelector('#selCita');
    const btnVerPago = document.querySelector('#btnVerPago');

    const copagoEl = document.querySelector('#copago');
    const medicinaEl = document.querySelector('#medicina');
    const totalEl = document.querySelector('#total');
    const transferidoEl = document.querySelector('#transferido');
    const formaEl = document.querySelector('#forma');
    const fechaPagoEl = document.querySelector('#fechaPago');
    const obsEl = document.querySelector('#obs');
    const btnGuardar = document.querySelector('#btnGuardar');
    const btnBorrar  = document.querySelector('#btnBorrar');
    const pagoIdEl = document.querySelector('#pagoId');

    const tbody = document.querySelector('#tblPagos tbody');

    // ==== helpers ====
    function setTotal() {
      const c = Number(copagoEl.value || 0);
      const m = Number(medicinaEl.value || 0);
      totalEl.value = (c + m).toFixed(2);
    }
    copagoEl.addEventListener('input', setTotal);
    medicinaEl.addEventListener('input', setTotal);

    async function cargarPacientes() {
      const { data } = await api('/api/paciente');
      data.sort((a,b)=>(a.apellido+a.nombre).localeCompare(b.apellido+b.nombre,'es'));
      selPaciente.innerHTML = '<option value="">-- Selecciona un paciente --</option>' +
        data.map(p => \`<option value="\${p.id}">\${p.apellido.toUpperCase()}, \${p.nombre} (CI: \${p.ci})</option>\`).join('');
    }

    async function buscarCitas() {
      const pid = Number(selPaciente.value);
      const fe  = (fFecha.value || '').trim();

      if (!pid) {
        selCita.innerHTML = '<option value="">-- Selecciona un paciente --</option>';
        selCita.disabled = true;
        btnVerPago.disabled = true;
        return setAlert(msg, 'Selecciona un paciente', true);
      }

      const qs = new URLSearchParams();
      qs.set('paciente_id', pid);
      if (fe) qs.set('fecha', fe);

      const { data } = await api(\`/api/cita?\${qs.toString()}\`);
      if (!Array.isArray(data) || data.length === 0) {
        selCita.innerHTML = '<option value="">(Sin citas)</option>';
        selCita.disabled = true;
        btnVerPago.disabled = true;
        return setAlert(msg, 'Este paciente no tiene citas (o no en esa fecha).');
      }

      selCita.innerHTML = '<option value="">-- Selecciona una cita --</option>' +
        data.map(c => \`<option value="\${c.id}">#\${c.id} · \${c.fecha} \${c.hora} · estado: \${c.estado}</option>\`).join('');
      selCita.disabled = false;
      btnVerPago.disabled = false;
    }

    async function verPagoActual() {
      const cid = Number(selCita.value);
      if (!cid) return setAlert(msg, 'Selecciona una cita', true);

      const { data } = await api(\`/api/pago?cita_id=\${cid}\`);
      if (Array.isArray(data) && data.length > 0) {
        const p = data[0];
        pagoIdEl.value = p.id;
        copagoEl.value = Number(p.copago ?? 0);
        medicinaEl.value = Number(p.medicina ?? 0);
        totalEl.value = Number(p.total_recibido ?? 0);
        transferidoEl.value = Number(p.valor_transferido ?? 0);
        formaEl.value = p.forma_pago ?? '';
        fechaPagoEl.value = p.fecha_pago ?? '';
        obsEl.value = p.observaciones ?? '';
        btnBorrar.style.display = 'inline-block';
      } else {
        // limpiar form
        pagoIdEl.value = '';
        copagoEl.value = '0';
        medicinaEl.value = '0';
        setTotal();
        transferidoEl.value = '0';
        formaEl.value = '';
        fechaPagoEl.value = '';
        obsEl.value = '';
        btnBorrar.style.display = 'none';
      }
    }

    async function guardarPago() {
      const cid = Number(selCita.value);
      if (!cid) return setAlert(msg, 'Selecciona una cita', true);

      const copago = Number(copagoEl.value || 0);
      const medicina = Number(medicinaEl.value || 0);
      const valor_transferido = Number(transferidoEl.value || 0);
      const forma_pago = (formaEl.value || '').trim();
      const fecha_pago = (fechaPagoEl.value || '').trim();
      const observaciones = (obsEl.value || '').trim();

      const body = { cita_id: cid, copago, medicina, valor_transferido, forma_pago, fecha_pago, observaciones };

      try {
        if (pagoIdEl.value) {
          // editar
          await api(\`/api/pago/\${Number(pagoIdEl.value)}\`, {
            method: 'PUT',
            body: JSON.stringify(body)
          });
          setAlert(msg, 'Pago actualizado');
        } else {
          // crear
          const r = await api('/api/pago', {
            method: 'POST',
            body: JSON.stringify(body)
          });
          setAlert(msg, \`Pago creado (id \${r.id})\`);
          pagoIdEl.value = r.id;
          btnBorrar.style.display = 'inline-block';
        }
        await recargarTablaPagos();
      } catch (e) {
        setAlert(msg, e.message, true);
      }
    }

    async function borrarPago() {
      if (!pagoIdEl.value) return;
      if (!confirm('¿Eliminar el pago?')) return;
      try {
        await api(\`/api/pago/\${Number(pagoIdEl.value)}\`, { method: 'DELETE' });
        setAlert(msg, 'Pago eliminado');
        pagoIdEl.value = '';
        await verPagoActual();
        await recargarTablaPagos();
      } catch (e) {
        setAlert(msg, e.message, true);
      }
    }

    async function recargarTablaPagos() {
      const { data } = await api('/api/pago');
      tbody.innerHTML = (data ?? []).slice(0, 20).map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.cita_id}</td>
          <td>${Number(p.copago ?? 0).toFixed(2)}</td>
          <td>${Number(p.medicina ?? 0).toFixed(2)}</td>
          <td>${Number(p.total_recibido ?? 0).toFixed(2)}</td>
          <td>${Number(p.valor_transferido ?? 0).toFixed(2)}</td>
          <td>${p.forma_pago ?? ''}</td>
          <td>${p.fecha_pago ?? ''}</td>
        </tr>
      `).join('');
    }

    // Eventos
    document.querySelector('#btnBuscarCitas').addEventListener('click', buscarCitas);
    document.querySelector('#btnVerPago').addEventListener('click', verPagoActual);
    document.querySelector('#selCita').addEventListener('change', verPagoActual);
    document.querySelector('#btnGuardar').addEventListener('click', guardarPago);
    document.querySelector('#btnBorrar').addEventListener('click', borrarPago);

    // Inicio
    addEventListener('DOMContentLoaded', async () => {
      await cargarPacientes();
      await recargarTablaPagos();
      setTotal();
    });
  </script>
</body>
</html>
