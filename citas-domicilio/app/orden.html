<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Orden de Atención</title>
  <link rel="stylesheet" href="/app/assets/css/styles.css"/>
  <style>
    body{background:#fff;color:#000}
    .sheet{max-width:920px;margin:14px auto;border:2px solid #2b2b2b}
    .hdr{background:#9ad091;color:#000;padding:10px 12px;border-bottom:2px solid #2b2b2b;text-align:center;font-weight:bold}
    .tbl{width:100%;border-collapse:collapse}
    .tbl td{border:1px solid #2b2b2b;padding:6px 8px;vertical-align:middle}
    .label{width:40%;font-weight:bold;background:#e7e7e7}
    .yellow{background:#ffe34d;font-weight:bold;text-transform:uppercase;text-align:center}
    .pink{background:#ffd6f1;font-weight:bold;text-transform:uppercase;text-align:center}
    .bar{display:flex;justify-content:space-between;max-width:920px;margin:8px auto}
  </style>
</head>
<body>
<div class="bar">
  <button onclick="window.print()">Imprimir / PDF</button>
  <a class="pill" href="/app/index.html">← Menú</a>
</div>

<div class="sheet">
  <div id="hdr" class="hdr">ORDEN DE ATENCIÓN</div>
  <table class="tbl"><tbody id="rows"></tbody></table>
</div>

<script>
function q(k){return new URL(location.href).searchParams.get(k);}
function row(t,lbl,val,klass=''){const tr=document.createElement('tr'); tr.innerHTML=`<td class="label">${lbl}</td><td class="${klass}">${val??''}</td>`; t.appendChild(tr);}
async function load(){
  const id=q('cita_id'); const t=document.getElementById('rows'); if(!id){ row(t,'Error','Falta cita_id'); return; }
  const r=await fetch(`/api/orden/${id}`).then(x=>x.json()).catch(()=>null);
  if(!r||!r.ok){ row(t,'Error','No se pudo cargar la cita'); return; }
  const d=r.data; document.getElementById('hdr').textContent=`ORDEN DE ATENCIÓN SEGURO ${ (d.seguro||'').toUpperCase() }`;

  row(t,'CÓDIGO DE SERVICIO','');                           // si luego defines un código, lo agregamos en el endpoint /api/orden
  row(t,'TRIAJE MANCHESTER','CÓDIGO AMARILLO','yellow');
  row(t,'SÍNTOMAS', d.sintomas || '');
  row(t,'NOMBRE BENEFICIO/SERVICIO','MÉDICO A DOMICILIO','pink');

  row(t,'CÉDULA DEL TITULAR', d.paciente_ci || '');
  row(t,'NOMBRE PACIENTE', d.paciente_nombre || '');
  row(t,'CÉDULA DEL PACIENTE', d.paciente_ci || '');

  // domicilio/dirección
  row(t,'DIRECCIÓN', d.direccion || '');
  row(t,'REFERENCIA', d.referencia || '');
  row(t,'SECTOR', d.sector || '');
  row(t,'CIUDAD', d.ciudad || '');
  row(t,'ZONA', d.zona || '');

  row(t,'HORA DESPACHO EQUIPO MÉDICO', d.hora || '');
  row(t,'VALOR COPAGO', Number(d.copago||0).toFixed(2));
  row(t,'TRASLADO AMBULANCIA', 0);
  row(t,'CONTACTO', d.telefono || '');
  row(t,'ASISTENCIA (MAWDY)', d.asistencia ?? '');
  row(t,'MOVIMIENTO (MAWDY)', d.movimiento ?? '');
}
document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
